<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Configurator Maker</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <main class="app">
      <section class="viewer" aria-label="3D configurator preview">
        <canvas id="scene"></canvas>
        <header class="topbar">
          <div>
            <p>Configurator Maker</p>
            <h1 id="projectTitle">Untitled Configurator</h1>
          </div>
          <div class="top-actions">
            <button id="resetCamera" title="카메라 초기화" aria-label="카메라 초기화">⌂</button>
            <button id="hotspotMode" title="핫스팟 추가 모드" aria-label="핫스팟 추가 모드">＋</button>
          </div>
        </header>
        <div class="drop-hint" id="dropHint">
          <strong>GLB 파일을 업로드하세요</strong>
          <span>모델을 불러오면 메시 파트를 자동으로 탐지합니다.</span>
        </div>
        <div class="hotspot-layer" id="hotspotLayer"></div>
      </section>

      <aside class="sidebar">
        <section class="panel">
          <div class="panel-head">
            <h2>프로젝트</h2>
            <button id="exportZip">배포 ZIP</button>
          </div>
          <label class="field">
            <span>이름</span>
            <input id="projectName" value="Untitled Configurator" />
          </label>
          <label class="upload">
            <input id="glbInput" type="file" accept=".glb,model/gltf-binary" />
            <span>GLB 업로드</span>
          </label>
          <div class="button-row">
            <button id="saveProject">프로젝트 저장</button>
            <label class="ghost-file">
              <input id="loadProject" type="file" accept="application/json,.json" />
              불러오기
            </label>
          </div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2>재질</h2>
            <button id="addMaterial">추가</button>
          </div>
          <div class="material-form">
            <input id="materialName" placeholder="재질명" value="New Material" />
            <input id="materialColor" type="color" value="#d7c7b2" />
            <label class="mini-upload">
              <input id="textureInput" type="file" accept="image/*" />
              텍스처
            </label>
          </div>
          <div class="material-list" id="materialList"></div>
        </section>

        <section class="panel parts-panel">
          <div class="panel-head">
            <h2>파트</h2>
            <span id="partCount">0</span>
          </div>
          <div class="parts-list" id="partsList"></div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2>핫스팟</h2>
            <span id="hotspotCount">0</span>
          </div>
          <div class="hotspot-editor" id="hotspotEditor">
            <p class="empty">핫스팟 추가 모드를 켜고 모델 표면을 클릭하세요.</p>
          </div>
          <div class="hotspot-list" id="hotspotList"></div>
        </section>
      </aside>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
